[package]
name = "msg-wkr"
version = "1.0.0"
edition = "2024"
authors = ["zbz"]
license = "MIT"
keywords = ["msg", "worker", "message", "executor"]
description = "Message worker client library for MSG, providing simplified worker operations"
categories = ["development-tools"]
homepage = "https://github.com/rusthing/msg"
repository = "https://github.com/rusthing/msg"
readme = "README.md"

[dependencies]
anyhow = { workspace = true }
tracing = { workspace = true }
config = { workspace = true }
arc-swap = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
reqwest = { workspace = true, features = ["multipart", "json", "stream"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full"] }
redis = { workspace = true }

wheel-rs = { workspace = true }
robotech = { workspace = true, features = ["feign", "redis", "macros"] }
msg-api = { workspace = true }
msg-api-client = { workspace = true }