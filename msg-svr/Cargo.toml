[package]
name = "msg-svr"
version = "1.0.0"
edition = "2024"
authors = ["zbz"]
license = "MIT"
keywords = ["msg", "message", "center"]
description = "A Rust-based general message center service system"
categories = ["web-programming::http-server"]
homepage = "https://github.com/rusthing/msg"
repository = "https://github.com/rusthing/msg"
readme = "README.md"

[dependencies]
anyhow = { workspace = true }
tracing = { workspace = true }
clap = { workspace = true, features = ["derive"] }
config = { workspace = true }
chrono = { workspace = true }
derive_setters = { workspace = true }
typed-builder = { workspace = true }
arc-swap = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_with = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "signal"] }
tokio-util = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true, features = ["macros", "multipart", "ws"] }
sqlx = { workspace = true, features = ["runtime-tokio", "any", "all-databases"] }
sea-orm = { workspace = true, features = ["sqlx-all", "runtime-tokio-rustls", "debug-print"] }
linkme = { workspace = true }
regex = { workspace = true }
o2o = { workspace = true }
validator = { workspace = true, features = ["derive"] }
strum = { workspace = true, features = ["derive"] }
utoipa = { workspace = true, features = ["axum_extras"] }
utoipa-swagger-ui = { workspace = true, features = ["axum", "vendored"] }
humantime = { workspace = true }

wheel-rs = { workspace = true }
idworker = { workspace = true, features = ["utils"] }
robotech = { workspace = true, features = ["db", "config-center", "registry-center", "macros", "redis", "nats", "local-cache"] }
msg-api = { workspace = true, features = ["server"] }
async-nats = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
# reqwest 只给短信/邮件网关用：关掉默认特性（默认 TLS 是 native-tls + 平台证书校验，
# musl 静态交叉编译下要 vendored openssl / cmake，代价远大于收益）。内网网关走 http，
# 真要接 https 时再按需加 rustls-no-provider 并自行装 crypto provider。
reqwest = { workspace = true, default-features = false }

[build-dependencies]
openssl = { version = "0.10.81", features = ["vendored"] }