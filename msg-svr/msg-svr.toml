profile = "dev"

[db]
url = "postgres://msgrs:msgrs@pgsql:5432/msgrs"

[web]
port = 9002

[redis]
url = "redis://:xxxxxxxx@redis:6379"

# 刷新信号订阅（robotech 通用配置，缓存与队列订阅共用）
[refresh]
# 订阅探活间隔：consumer 丢失（NATS 重启 / 断连超时 / 人工删除）后，
# 最多经过该时长会被发现并重建订阅，重建后立即补一次刷新动作。
# 支持 humantime 写法（500ms / 15s / 1m），默认 15s，下限 1s。
# 历史段名 [local-cache] 仍兼容，两者同时存在时以本段为准。
probe-interval = "15s"

[micro-svc.consul]
base-url = "http://consul:8500"
[micro-svc.consul.registry]
