## MSG 业务配置
#[msg]
## 业务队列（persisted=true）消费失败的最大重投次数，达到上限后转入死信 dlq.{subject}
## 配置 <= 0 时按下限 1 处理（NATS 用 -1 表示不限制，别在这里配 0）
## 热更新：改完立即重建订阅并原地更新 consumer，无需重启
#max-deliver = 5
## 死信队列自身落库失败的最大重投次数（死信消费只写一张表，失败多半是库的问题）
#dead-letter-max-deliver = 3

## 刷新信号订阅（robotech 通用配置，缓存与队列订阅共用）
#[refresh]
## 订阅探活间隔：consumer 丢失（NATS 重启 / 断连超时 / 人工删除）后，
## 最多经过该时长会被发现并重建订阅，重建后立即补一次刷新动作。
## 支持 humantime 写法（500ms / 15s / 1m），默认 15s，下限 1s。
## 历史段名 [local-cache] 仍兼容，两者同时存在时以本段为准。
#probe-interval = "15s"

[micro-svc.consul]
base-url = "http://consul:8500"
[micro-svc.consul.config]
common-configs = ["redis.toml", "nats.toml"]
[micro-svc.consul.registry]
